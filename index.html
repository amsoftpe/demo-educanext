    <script type="text/javascript">
      // Contraparte de public/404.html: decodifica la ruta empaquetada en
      // el query string y la reescribe en la barra ANTES de que Angular
      // arranque, para que el router la lea como si nunca hubiera pasado
      // por el 404. Sin efecto en una navegacion normal (no hay `?/`).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
